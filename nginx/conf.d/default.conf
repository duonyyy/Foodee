# ==============================================================================
# Foodee Platform — Default Unified Server Block (Localhost / Development / Single IP)
# ==============================================================================

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name localhost _ 127.0.0.1;

    # --------------------------------------------------------------------------
    # Common Security Headers
    # --------------------------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --------------------------------------------------------------------------
    # Standard Proxy Headers
    # --------------------------------------------------------------------------
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;

    # --------------------------------------------------------------------------
    # 1. Health Check Endpoint (For Docker, K8s, Cloud Load Balancers)
    # --------------------------------------------------------------------------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "OK\n";
    }

    # --------------------------------------------------------------------------
    # 2. Next.js Static Optimization & Assets
    # --------------------------------------------------------------------------
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    location /_next/image {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        expires 7d;
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
    }

    # --------------------------------------------------------------------------
    # 3. Core API — Swagger Documentation
    # --------------------------------------------------------------------------
    location /api/docs {
        proxy_pass http://api_upstream/api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------------------------
    # 4. Core API — GraphQL Endpoint & Subscriptions (WebSocket Support)
    # --------------------------------------------------------------------------
    location /graphql {
        proxy_pass http://api_upstream/graphql;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        
        # Subscriptions require persistent connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 5. Core API — Sensitive Auth Endpoints (Brute-Force Protected)
    # --------------------------------------------------------------------------
    location /auth/ {
        limit_req zone=auth_limit burst=10 nodelay;
        
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------------------------
    # Next.js server routes must stay with the frontend before /api/* is rewritten.
    location ^~ /api/media/ {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        client_max_body_size 6M;
    }

    location = /api/chat {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
    }

    # 6. Core API — General API Route (/api/*)
    # --------------------------------------------------------------------------
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------------------------
    # 7. Core API — Direct Feature Routes (Support Direct Path Access)
    # --------------------------------------------------------------------------
    location ~ ^/(foods|categories|toppings|orders|payments|delivery|shippers|restaurants|reviews|promotions|users|locations|notifications|analytics|health)(/|$) {
        limit_req zone=api_limit burst=50 nodelay;
        
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # --------------------------------------------------------------------------
    # 8. AI Microservice — Chatbot (FastAPI / Port 8000)
    # --------------------------------------------------------------------------
    location /ai/ {
        limit_req zone=ai_limit burst=20 nodelay;
        
        rewrite ^/ai/(.*)$ /$1 break;
        proxy_pass http://chatbot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_read_timeout 300s;
    }

    location /chatbot/ {
        limit_req zone=ai_limit burst=20 nodelay;
        
        rewrite ^/chatbot/(.*)$ /$1 break;
        proxy_pass http://chatbot_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 9. AI Microservice — Food Vision / YOLO (Flask / Port 5000)
    # --------------------------------------------------------------------------
    location /food-ai/ {
        limit_req zone=ai_limit burst=20 nodelay;
        
        rewrite ^/food-ai/(.*)$ /$1 break;
        proxy_pass http://vision_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    location /vision/ {
        limit_req zone=ai_limit burst=20 nodelay;
        
        rewrite ^/vision/(.*)$ /$1 break;
        proxy_pass http://vision_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        client_max_body_size 100M;
        proxy_read_timeout 300s;
    }

    # --------------------------------------------------------------------------
    # 10. MinIO Object Storage (S3 API & Uploads)
    # --------------------------------------------------------------------------
    location /storage/ {
        rewrite ^/storage/(.*)$ /$1 break;
        proxy_pass http://minio_s3_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        client_max_body_size 50M;
        proxy_set_header Host $http_host;
    }

    # --------------------------------------------------------------------------
    # 11. MinIO Web Console (Management UI)
    # --------------------------------------------------------------------------
    location /minio-console/ {
        rewrite ^/minio-console/(.*)$ /$1 break;
        proxy_pass http://minio_console_upstream;
        proxy_http_version 1.1;
        
        # Support MinIO Console WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $http_host;
        
        proxy_read_timeout 86400s;
    }

    # --------------------------------------------------------------------------
    # 12. Frontend Web Client — Default Catch-All (Next.js / Port 3000)
    # --------------------------------------------------------------------------
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        
        # Support Next.js HMR (Hot Module Replacement) WebSockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    # --------------------------------------------------------------------------
    # Custom Error Pages
    # --------------------------------------------------------------------------
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
