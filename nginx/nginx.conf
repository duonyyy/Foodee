# ==============================================================================
# Foodee Platform — High Performance Reverse Proxy & API Gateway
# ==============================================================================

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Structured JSON Logging
    # --------------------------------------------------------------------------
    log_format main_json escape=json '{'
        '"time_local":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request_method":"$request_method",'
        '"request_uri":"$request_uri",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"http_x_forwarded_for":"$http_x_forwarded_for",'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_status":"$upstream_status",'
        '"upstream_response_time":"$upstream_response_time"'
    '}';

    access_log /var/log/nginx/access.log main_json;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # Optimization & TCP Settings
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Buffer & Payload Settings (Support image & video uploads up to 100MB)
    client_max_body_size 100M;
    client_body_buffer_size 128k;
    client_header_buffer_size 2k;
    large_client_header_buffers 4 16k;

    # Timeouts for Long-Running Operations (AI Video / Image Inference)
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    proxy_connect_timeout 60s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # --------------------------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --------------------------------------------------------------------------
    # Rate Limiting Zones (DDoS & Brute-force Mitigation)
    # --------------------------------------------------------------------------
    # General API requests: max 30 req/sec per IP, burst 50
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
    
    # Sensitive Auth endpoints (login, register, password reset): max 5 req/sec per IP, burst 10
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    # AI heavy endpoints (video/image inference): max 10 req/sec per IP, burst 20
    limit_req_zone $binary_remote_addr zone=ai_limit:10m rate=10r/s;

    # --------------------------------------------------------------------------
    # WebSocket & Connection Upgrade Mapping
    # --------------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker Embedded DNS Resolver
    resolver 127.0.0.11 valid=30s ipv6=off;

    # --------------------------------------------------------------------------
    # Upstream Service Definitions (Internal Docker Network DNS)
    # --------------------------------------------------------------------------
    upstream frontend_upstream {
        server frontend:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream api_upstream {
        server api:3001 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    upstream chatbot_upstream {
        server ai-server:8000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream vision_upstream {
        server food-ai:5000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream minio_s3_upstream {
        server minio:9000 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    upstream minio_console_upstream {
        server minio:9001 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # --------------------------------------------------------------------------
    # Load Virtual Host Configurations
    # --------------------------------------------------------------------------
    include /etc/nginx/conf.d/*.conf;
}
