name: CI - Foodee Platform

on:
  push:
    branches:
      - main
      - master
      - develop
      - 'codex/**'
  pull_request:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # 0. Path Filter: Only run jobs for modified services in Pull Requests
  # ============================================================================
  changes:
    name: Detect Changed Components
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      chatbot: ${{ steps.filter.outputs.chatbot }}
      vision: ${{ steps.filter.outputs.vision }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Evaluate Changed Paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'core-api/**'
            frontend:
              - 'web-client/**'
            chatbot:
              - 'chatbot-service/**'
            vision:
              - 'vision-service/**'
            docker:
              - 'docker-compose.yml'
              - 'compose.prod.yml'
              - '.env.example'
              - '.env.production.example'
              - 'nginx/**'
              - 'scripts/prod-preflight.py'
              - 'scripts/verify-prod-config.py'
              - 'scripts/verify-nginx.sh'
              - '**/Dockerfile'
              - '**/docker/**'

  # ============================================================================
  # 1. Backend CI: NestJS Core API & TypeORM
  # ============================================================================
  backend-ci:
    name: Backend (Core API)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core-api
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: core-api/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Application
        run: npm run build

      - name: Run Unit Tests
        run: npm run test:unit

  # ============================================================================
  # 2. Frontend CI: Next.js Web Client
  # ============================================================================
  frontend-ci:
    name: Frontend (Web Client)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: web-client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript Type Check
        run: npm run typecheck

      - name: Build Next.js Production Bundle
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:3001"
          NEXT_PUBLIC_FOOD_AI_URL: "http://localhost:5000"
          NEXT_PUBLIC_GOOGLE_REDIRECT_URI: "http://localhost:3000/api/auth/callback/google"
          NEXT_PUBLIC_CLIENT_ID: "ci-dummy-client-id"
          NEXT_PUBLIC_MAPBOX_ACCESS_TOKEN: "ci-dummy-mapbox-token"

  # ============================================================================
  # 3. AI Services CI: Vision & Chatbot (Python 3.11)
  # ============================================================================
  ai-services-ci:
    name: AI Services (Vision & Chatbot)
    needs: changes
    if: ${{ needs.changes.outputs.chatbot == 'true' || needs.changes.outputs.vision == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            chatbot-service/requirements.txt
            vision-service/requirements.txt

      - name: Validate Chatbot Service
        if: ${{ needs.changes.outputs.chatbot == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
        working-directory: chatbot-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app

      - name: Validate Vision Service
        if: ${{ needs.changes.outputs.vision == 'true' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch' }}
        working-directory: vision-service
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m compileall app

  # ============================================================================
  # 4. Infrastructure CI: Docker Compose Validation
  # ============================================================================
  docker-validation:
    name: Docker & Infrastructure Validation
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Prepare Root Environment File
        run: |
          cp .env.example .env
          cp .env.example core-api/.env
          cp chatbot-service/.env.example chatbot-service/.env
          cp .env.example web-client/.env.local

      - name: Validate Root Docker Compose File
        run: docker compose config --quiet

      - name: Validate Production Compose And Safety Gate
        run: python3 scripts/verify-prod-config.py

      - name: Validate Production Nginx
        run: bash scripts/verify-nginx.sh

  # ============================================================================
  # 5. CI Status Gate (Consolidated check for PR merge status)
  # ============================================================================
  ci-status:
    name: CI Status Gate
    needs: [changes, backend-ci, frontend-ci, ai-services-ci, docker-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify All CI Checks
        run: |
          echo "Evaluating CI job statuses..."

          check_status() {
            local name="$1"
            local status="$2"
            echo "Job $name: $status"
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              echo "❌ Error: Job '$name' did not pass (status: $status)!"
              exit 1
            fi
          }

          if [ "${{ needs.changes.result }}" != "success" ]; then
            echo "❌ Changed-path detection did not succeed"
            exit 1
          fi

          check_status "Backend CI" "${{ needs.backend-ci.result }}"
          check_status "Frontend CI" "${{ needs.frontend-ci.result }}"
          check_status "AI Services CI" "${{ needs.ai-services-ci.result }}"
          check_status "Docker Validation" "${{ needs.docker-validation.result }}"

          echo "✅ All required CI workflows completed successfully!"
